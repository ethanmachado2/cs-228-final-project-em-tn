# fpv pipeline configuration, schema v1 (FROZEN by `fpv calibrate`; do not edit by hand).
# Calibrated from cs_64b26a53f92a train + validation scores; see provenance.
# Everything except `provenance` is hashed into config_set_id. `fpv evaluate --split test` runs once
# per config_set_id (test_report_<config_set_id>.json).
schema_version: 1
frozen: true
thresholds:
  nfiq2_min: 5
  minutiae_min: 12
  bozorth3_match: 43
session:
  max_presentations: 3
quality:
  nfiq2_upscale: 3.0
preprocess:
  max_attempts: 3
  attempts:
  - attempt_no: 1
    name: traditional
    segmentation: GMFS
    orientation: GBFOE
    frequency: XSFFE
    enhancement: GBFEN
    resample: 3.0
  - attempt_no: 2
    name: deep
    segmentation: SUFS
    orientation: SNFOE
    frequency: SNFFE
    enhancement: SNFEN
    resample: 3.0
  - attempt_no: 3
    name: deep_boost
    segmentation: SUFS
    orientation: SNFOE
    frequency: SNFFE
    enhancement: SNFEN
    resample: 3.0
    clahe:
      clip_limit: 2.0
      tile: 8
    sbmex_overrides:
      minimum_background_distance: 4
adapter:
  version: xyt-adapter/1
evaluation:
  seed: 42
  impostors_per_probe: 5
calibration:
  target_fmrs:
  - 0.001
  - 0.01
  primary_target_fmr: 0.01
  operating_points:
  - target_fmr: 0.001
    bozorth3_match: 60
    low_confidence: false
  - target_fmr: 0.01
    bozorth3_match: 43
    low_confidence: false
tools:
  nfiq2: 2.3.0
  nbis: 5.0.0
  pyfing: 0.7.3
  tensorflow: 2.21.0
  keras: 3.15.1
  opencv: 5.0.0
paths:
  raw: data/raw
  splits: data/processed/dataset_splits.csv
  exclusions: data/quality_reports/duplicate_exclusions.csv
  templates: data/templates
  probes: data/probes
  db: data/db/fpv.sqlite
  reports: data/quality_reports
